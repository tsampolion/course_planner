name: Release

# Tags and publishes a GitHub release for the versionName in app/build.gradle.kts.
# Runs after the Android workflow passes on a push to main. Nothing happens when the tag already exists.
# Run it manually with a commit SHA to tag an older merge: it fetches the APK from that commit's Android run, and
# refuses to publish without one unless allow_no_apk is ticked (CI artifacts expire after 90 days). A release without
# its APK can't be fixed by running again, since the tag then exists.
on:
  workflow_run:
    workflows: [Android]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch to release
        required: true
        default: main
      allow_no_apk:
        description: Publish without an APK if that commit's Android run no longer has one
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=app/build.gradle.kts::versionName '$version' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check for an existing tag
        id: existing
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::notice::$TAG already exists; nothing to release"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: http/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error file=CHANGELOG.md::No '## [$VERSION]' section in CHANGELOG.md"
            exit 1
          fi

      - name: Download the APK built for this commit
        if: steps.existing.outputs.exists == 'false' && github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: course-pacer-apk
          path: apk
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Find and download the APK built for this commit
        if: steps.existing.outputs.exists == 'false' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.version.outputs.sha }}
        shell: bash
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow Android --commit "$SHA" --event push --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run" ]; then
            echo "::warning::No successful Android run on a push of $SHA, so there is no APK to attach"
            exit 0
          fi
          # Builds before 2.0.0 uploaded the APK as coursebook-pacer-apk.
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name course-pacer-apk --dir apk \
            || gh run download "$run" --repo "$GITHUB_REPOSITORY" --name coursebook-pacer-apk --dir apk \
            || echo "::warning::Android run $run no longer has its APK (artifacts expire after 90 days)"

      # Refuses an APK that isn't signed with the release certificate, and names the certificate in the notes.
      # Refuses to publish with no APK at all, unless a manual run allows it.
      - name: Create tag and release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
          EXPECTED_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
          ALLOW_NO_APK: ${{ inputs.allow_no_apk }}
        shell: bash
        run: |
          # Pinned as in android.yml: newer apksigner versions print certificates differently.
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          expected=$(printf '%s' "$EXPECTED_SHA256" | tr -d ': \r\n' | tr 'A-F' 'a-f')
          shopt -s nullglob
          apks=()
          for f in apk/*.apk; do
            digest=$("$apksigner" verify --print-certs "$f" | sed -n 's/^Signer.* certificate SHA-256 digest: //p' | sort -u)
            if [ -z "$expected" ] || [ "$digest" != "$expected" ]; then
              echo "::error::$f is signed with '$digest', not the release certificate '$expected' (SIGNING_CERT_SHA256)"
              exit 1
            fi
            # Installed apps look for exactly this asset name on the vX.Y.Z release (docs/UPDATES_BRIEF.md); don't rename it.
            cp "$f" "course-pacer-$VERSION.apk"
            apks+=("course-pacer-$VERSION.apk")
            printf '\nSigned with certificate SHA-256 `%s`.\n' "$digest" >> notes.md
          done
          if [ "${#apks[@]}" -eq 0 ] && [ "$ALLOW_NO_APK" != "true" ]; then
            echo "::error::No APK for $SHA, so $TAG was not created. Run it manually with allow_no_apk to publish without one."
            exit 1
          fi
          gh release create "$TAG" "${apks[@]}" \
            --target "$SHA" \
            --title "Course Pacer $VERSION" \
            --notes-file notes.md
