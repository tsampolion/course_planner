name: Release

# Tags and publishes a GitHub release for the versionName in app/build.gradle.kts.
# Runs after the Android workflow passes on a push to main. Nothing happens when the tag already exists.
# Run it manually with a commit SHA to tag an older merge.
on:
  workflow_run:
    workflows: [Android]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch to release
        required: true
        default: main

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=app/build.gradle.kts::versionName '$version' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check for an existing tag
        id: existing
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::notice::$TAG already exists; nothing to release"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: http/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error file=CHANGELOG.md::No '## [$VERSION]' section in CHANGELOG.md"
            exit 1
          fi

      - name: Download the APK built for this commit
        if: steps.existing.outputs.exists == 'false' && github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: coursebook-pacer-apk
          path: apk
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Refuses an APK that isn't signed with the release certificate, and names the certificate in the notes.
      - name: Create tag and release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
          EXPECTED_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          expected=$(printf '%s' "$EXPECTED_SHA256" | tr -d ': \r\n' | tr 'A-F' 'a-f')
          shopt -s nullglob
          apks=()
          for f in apk/*.apk; do
            digest=$("$apksigner" verify --print-certs "$f" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            if [ -z "$expected" ] || [ "$digest" != "$expected" ]; then
              echo "::error::$f is signed with '$digest', not the release certificate '$expected' (SIGNING_CERT_SHA256)"
              exit 1
            fi
            cp "$f" "coursebook-pacer-$VERSION.apk"
            apks+=("coursebook-pacer-$VERSION.apk")
            printf '\nSigned with certificate SHA-256 `%s`.\n' "$digest" >> notes.md
          done
          gh release create "$TAG" "${apks[@]}" \
            --target "$SHA" \
            --title "Course Pacer $VERSION" \
            --notes-file notes.md
